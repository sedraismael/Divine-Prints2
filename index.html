<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Prints | بصمات إلهية</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="title">Divine Prints | <span>بصمات إلهية</span></h1>
    <p class="description">
        بصمات إلهية هو تطبيق ويب تفاعلي يتيح للمستخدمين تحميل صورة لبصمتهم، والحصول على آية قرآنية مخصصة، ومعلومة علمية، وتجربة بصرية جميلة، بناءً على النمط الفريد لبصمتهم: الأقواس، أو الحلقات، أو الدوَّامات، أو الحواف.
    </p>
    <input type="file" id="fingerprintInput" accept="image/*">
    <button onclick="analyzeFingerprint()">Analyze Fingerprint</button>
    <div id="result"></div>

    <footer>
        <p>Made with 💖 by Sedra, Taleen, Mona, and Yara</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
